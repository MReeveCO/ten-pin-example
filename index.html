<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ten Pin Scorer</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <script src="scripts/main.js"></script>
  <h1>TEN PIN SCORER</h1>

  <div id="lane">
    <!-- pins arranged back-to-front, as seen from above -->
    <div class="row">
      <div class="pin" data-pin="7"></div>
      <div class="pin" data-pin="8"></div>
      <div class="pin" data-pin="9"></div>
      <div class="pin" data-pin="10"></div>
    </div>
    <div class="row">
      <div class="pin" data-pin="4"></div>
      <div class="pin" data-pin="5"></div>
      <div class="pin" data-pin="6"></div>
    </div>
    <div class="row">
      <div class="pin" data-pin="2"></div>
      <div class="pin" data-pin="3"></div>
    </div>
    <div class="row">
      <div class="pin" data-pin="1"></div>
    </div>
  </div>

  <div id="score-area">Click pins to knock them down</div>

  <button id="done-btn">DONE</button>
  <button id="reset-btn">Reset</button>
</body>
</html>
